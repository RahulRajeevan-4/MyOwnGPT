<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Assistant (Ollama)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0b1020; color: #e6ebff; }
      .app { max-width: 900px; margin: 0 auto; padding: 20px; }
      .card { background: #121a30; border: 1px solid #283251; border-radius: 14px; padding: 16px; }
      .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
      .btn { border: 1px solid #4e79ff; background: #2443a8; color: #fff; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; }
      .btn.stop { background: #7e1f31; border-color: #c23a58; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .meta { color: #9fb1e4; font-size: 13px; }
      .controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 12px; }
      input[type="text"] { width: 100%; background: #0f172b; color: #e6ebff; border: 1px solid #33416a; border-radius: 8px; padding: 9px; }
      label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #b7c4ea; }
      .chat { max-height: 62vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
      .msg { border-radius: 12px; padding: 10px 12px; border: 1px solid #324064; white-space: pre-wrap; line-height: 1.4; }
      .user { background: #1a2f63; align-self: flex-end; max-width: 80%; }
      .assistant { background: #17213c; align-self: flex-start; max-width: 92%; }
      .small { color: #92a7de; font-size: 12px; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const SYSTEM_PROMPT = `You are an on-device voice assistant running on a local Ollama model.
Always provide high-quality, detailed answers (not one-liners).
Response style rules:
1) Start with a concise summary.
2) Then give a structured deep explanation with headings and bullets.
3) Include practical steps/checklists where useful.
4) If uncertain, state assumptions clearly.
5) Keep context from earlier user turns and resolve follow-up references.`;

      function App() {
        const [messages, setMessages] = useState([
          { role: "assistant", content: "Hi! Click Start Voice to begin listening." },
        ]);
        const [model, setModel] = useState("dolphin-llama3");
        const [apiUrl, setApiUrl] = useState("/api/ai/chat-stream");
        const [voiceEnabled, setVoiceEnabled] = useState(false);
        const [status, setStatus] = useState("idle");
        const [webSearch, setWebSearch] = useState(false);

        const recognitionRef = useRef(null);
        const listeningRef = useRef(false);
        const speakingRef = useRef(false);
        const streamAbortRef = useRef(null);
        const conversationRef = useRef([{ role: "system", content: SYSTEM_PROMPT }]);
        const chatRef = useRef(null);

        const speechSupported = useMemo(() => {
          return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
        }, []);

        useEffect(() => {
          if (!chatRef.current) return;
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }, [messages]);

        useEffect(() => {
          if (!speechSupported) return;
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = "en-US";

          recognition.onresult = (event) => {
            let finalText = "";
            for (let i = event.resultIndex; i < event.results.length; i += 1) {
              const result = event.results[i];
              if (result.isFinal) finalText += result[0].transcript;
            }

            const transcript = finalText.trim();
            if (!transcript) return;

            if (speakingRef.current) {
              window.speechSynthesis.cancel();
              speakingRef.current = false;
            }

            if (streamAbortRef.current) {
              streamAbortRef.current.abort();
              streamAbortRef.current = null;
            }

            askAssistant(transcript);
          };

          recognition.onend = () => {
            if (listeningRef.current) {
              recognition.start();
            }
          };

          recognition.onerror = () => {
            setStatus("mic-error");
          };

          recognitionRef.current = recognition;
          return () => {
            listeningRef.current = false;
            recognition.stop();
          };
        }, [speechSupported]);

        async function askAssistant(userText) {
          const userMessage = { role: "user", content: userText };
          const currentConversation = [...conversationRef.current, userMessage];
          conversationRef.current = currentConversation;
          setMessages((prev) => [...prev, userMessage, { role: "assistant", content: "..." }]);
          setStatus("thinking");

          const controller = new AbortController();
          streamAbortRef.current = controller;

          let assistantText = "";
          try {
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ messages: currentConversation, model, webSearch }),
              signal: controller.signal,
            });

            if (!response.ok || !response.body) throw new Error("Streaming failed.");
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const parts = buffer.split("\n\n");
              buffer = parts.pop() || "";

              for (const part of parts) {
                const line = part.split("\n").find((l) => l.startsWith("data:"));
                if (!line) continue;
                const payload = line.replace("data:", "").trim();
                if (!payload) continue;
                let parsed;
                try { parsed = JSON.parse(payload); } catch { continue; }
                const chunk = parsed?.message?.content || "";
                if (chunk) {
                  assistantText += chunk;
                  setMessages((prev) => {
                    const next = [...prev];
                    next[next.length - 1] = { role: "assistant", content: assistantText };
                    return next;
                  });
                }
              }
            }

            conversationRef.current = [...conversationRef.current, { role: "assistant", content: assistantText }];
            setStatus(listeningRef.current ? "listening" : "idle");

            if (voiceEnabled && assistantText) {
              const utterance = new SpeechSynthesisUtterance(assistantText);
              utterance.rate = 1;
              utterance.pitch = 1;
              utterance.onstart = () => {
                speakingRef.current = true;
                setStatus("speaking");
              };
              utterance.onend = () => {
                speakingRef.current = false;
                setStatus(listeningRef.current ? "listening" : "idle");
              };
              window.speechSynthesis.speak(utterance);
            }
          } catch (error) {
            if (error.name !== "AbortError") {
              setMessages((prev) => {
                const next = [...prev];
                next[next.length - 1] = {
                  role: "assistant",
                  content: `Error: ${error.message}`,
                };
                return next;
              });
              setStatus("error");
            }
          } finally {
            streamAbortRef.current = null;
          }
        }

        function toggleVoice() {
          if (!speechSupported) return;

          if (!voiceEnabled) {
            listeningRef.current = true;
            recognitionRef.current.start();
            setVoiceEnabled(true);
            setStatus("listening");
            return;
          }

          listeningRef.current = false;
          recognitionRef.current.stop();
          if (streamAbortRef.current) streamAbortRef.current.abort();
          window.speechSynthesis.cancel();
          speakingRef.current = false;
          setVoiceEnabled(false);
          setStatus("idle");
        }

        return (
          <div className="app">
            <div className="card">
              <div className="top">
                <div>
                  <h2 style={{ margin: 0 }}>Local Voice Assistant</h2>
                  <div className="meta">Low battery mode: mic is active only after pressing Start Voice.</div>
                </div>
                <button className={`btn ${voiceEnabled ? "stop" : ""}`} onClick={toggleVoice} disabled={!speechSupported}>
                  {voiceEnabled ? "Stop Voice" : "Start Voice"}
                </button>
              </div>

              <div className="controls">
                <input type="text" value={apiUrl} onChange={(e) => setApiUrl(e.target.value)} />
                <input type="text" value={model} onChange={(e) => setModel(e.target.value)} />
                <label>
                  <input type="checkbox" checked={webSearch} onChange={(e) => setWebSearch(e.target.checked)} />
                  Web Search
                </label>
              </div>

              <div className="meta" style={{ marginBottom: 8 }}>Status: {status}</div>

              <div className="chat" ref={chatRef}>
                {messages.map((m, idx) => (
                  <div key={idx} className={`msg ${m.role === "user" ? "user" : "assistant"}`}>
                    <div className="small">{m.role === "user" ? "You" : "Assistant"}</div>
                    {m.content}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
