<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Assistant (Ollama)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a30;
        --panel-soft: #0f172b;
        --text: #ecf2ff;
        --muted: #9fb1e4;
        --border: #2a3558;
        --primary: #355ed9;
        --primary-border: #4f76ef;
        --danger: #7e1f31;
        --danger-border: #c23a58;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background:
          radial-gradient(1000px 600px at 10% -20%, #1d2b57 0%, transparent 60%),
          radial-gradient(900px 500px at 100% -10%, #1a2140 0%, transparent 50%),
          var(--bg);
        color: var(--text);
      }
      .container { max-width: 1000px; margin: 28px auto; padding: 0 16px; }
      .panel { background: rgba(18, 26, 48, 0.9); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
      .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
      h1 { margin: 0; font-size: 1.2rem; }
      .subtitle { margin-top: 6px; font-size: 0.9rem; color: var(--muted); }
      .btn { border: 1px solid var(--primary-border); background: var(--primary); color: #fff; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; min-width: 132px; }
      .btn.stop { background: var(--danger); border-color: var(--danger-border); }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .meta-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; }
      @media (max-width: 860px) { .meta-row { grid-template-columns: 1fr; } }
      input[type="text"] { width: 100%; background: var(--panel-soft); color: var(--text); border: 1px solid #33416a; border-radius: 10px; padding: 10px; }
      .checkbox { display: flex; align-items: center; gap: 8px; color: #c9d6fb; font-size: 0.93rem; }
      .status-card { background: rgba(15, 23, 43, 0.9); border: 1px solid #2e3c63; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
      .status-line { color: var(--muted); font-size: 0.9rem; }
      .live-line { margin-top: 4px; font-size: 0.92rem; color: #dbe7ff; }
      .chat { max-height: 62vh; min-height: 330px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
      .msg { border-radius: 12px; padding: 10px 12px; border: 1px solid #324064; white-space: pre-wrap; line-height: 1.5; }
      .user { background: #213a77; align-self: flex-end; max-width: 80%; }
      .assistant { background: #162242; align-self: flex-start; max-width: 92%; }
      .small { color: #9bb0e8; font-size: 12px; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const SYSTEM_PROMPT = `You are an on-device voice assistant running on a local Ollama model.
Always provide high-quality, detailed answers (not one-liners).
Response style rules:
1) Start with a concise summary.
2) Then give a structured deep explanation with headings and bullets.
3) Include practical steps/checklists where useful.
4) If uncertain, state assumptions clearly.
5) Keep context from earlier user turns and resolve follow-up references.`;

      const inferDefaultApi = () => {
        const { protocol, hostname, port } = window.location;
        const sameHostApi = `${protocol}//${hostname}:3000/api/ai/chat-stream`;
        if (port === "3000") return "/api/ai/chat-stream";
        return sameHostApi;
      };

      const inferDefaultTtsApi = () => {
        const { protocol, hostname, port } = window.location;
        const sameHostApi = `${protocol}//${hostname}:3000/api/ai/tts`;
        if (port === "3000") return "/api/ai/tts";
        return sameHostApi;
      };

      function App() {
        const [messages, setMessages] = useState([
          { role: "assistant", content: "Hi! Click Start Voice and ask your question." },
        ]);
        const [model, setModel] = useState("dolphin-llama3");
        const [ttsModel, setTtsModel] = useState("qwen3-tts");
        const [apiUrl, setApiUrl] = useState(inferDefaultApi());
        const [ttsApiUrl, setTtsApiUrl] = useState(inferDefaultTtsApi());
        const [voiceEnabled, setVoiceEnabled] = useState(false);
        const [status, setStatus] = useState("idle");
        const [webSearch, setWebSearch] = useState(false);
        const [liveTranscript, setLiveTranscript] = useState("");

        const recognitionRef = useRef(null);
        const listeningRef = useRef(false);
        const speakingRef = useRef(false);
        const voiceEnabledRef = useRef(false);
        const streamAbortRef = useRef(null);
        const conversationRef = useRef([{ role: "system", content: SYSTEM_PROMPT }]);
        const chatRef = useRef(null);

        const speechSupported = useMemo(() => !!(window.SpeechRecognition || window.webkitSpeechRecognition), []);

        useEffect(() => {
          voiceEnabledRef.current = voiceEnabled;
        }, [voiceEnabled]);

        useEffect(() => {
          if (!chatRef.current) return;
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }, [messages]);

        function startListening() {
          if (!recognitionRef.current || !voiceEnabledRef.current || speakingRef.current) return;
          if (listeningRef.current) return;
          try {
            recognitionRef.current.start();
            listeningRef.current = true;
            setStatus("listening");
          } catch {
            // ignore rapid restart errors
          }
        }

        function stopListening() {
          if (!recognitionRef.current || !listeningRef.current) return;
          listeningRef.current = false;
          try { recognitionRef.current.stop(); } catch {}
        }

        async function synthesizeWithQwen3Tts(text) {
          const res = await fetch(ttsApiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, model: ttsModel }),
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data?.audioBase64) {
            throw new Error(data?.error || `Qwen3-TTS failed (${res.status})`);
          }

          const audio = new Audio(`data:${data.mimeType || "audio/wav"};base64,${data.audioBase64}`);
          speakingRef.current = true;
          setStatus("speaking");

          await new Promise((resolve, reject) => {
            audio.onended = resolve;
            audio.onerror = () => reject(new Error("Audio playback failed"));
            audio.play().catch(reject);
          });

          speakingRef.current = false;
        }

        function fallbackBrowserSpeak(text) {
          return new Promise((resolve, reject) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.onstart = () => {
              speakingRef.current = true;
              setStatus("speaking");
            };
            utterance.onend = () => {
              speakingRef.current = false;
              resolve();
            };
            utterance.onerror = () => {
              speakingRef.current = false;
              reject(new Error("Browser speech synthesis failed"));
            };
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
          });
        }

        async function speakAssistantText(text) {
          const content = String(text || "").trim();
          if (!content) return;

          stopListening();
          try {
            await synthesizeWithQwen3Tts(content);
          } catch {
            await fallbackBrowserSpeak(content);
          } finally {
            if (voiceEnabledRef.current) {
              startListening();
            } else {
              setStatus("idle");
            }
          }
        }

        useEffect(() => {
          if (!speechSupported) return;

          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;
          recognition.lang = "en-US";

          recognition.onresult = (event) => {
            let interimText = "";
            let finalText = "";

            for (let i = event.resultIndex; i < event.results.length; i += 1) {
              const result = event.results[i];
              if (result.isFinal) finalText += result[0].transcript;
              else interimText += result[0].transcript;
            }

            setLiveTranscript((interimText || finalText).trim());

            const transcript = finalText.trim();
            if (!transcript) return;

            if (speakingRef.current) {
              window.speechSynthesis.cancel();
              speakingRef.current = false;
            }

            if (streamAbortRef.current) {
              streamAbortRef.current.abort();
              streamAbortRef.current = null;
            }

            stopListening();
            setLiveTranscript("");
            askAssistant(transcript);
          };

          recognition.onend = () => {
            listeningRef.current = false;
            if (voiceEnabledRef.current && !speakingRef.current && !streamAbortRef.current) {
              startListening();
            }
          };

          recognition.onerror = () => {
            listeningRef.current = false;
            setStatus("mic-error");
          };

          recognitionRef.current = recognition;
          return () => {
            listeningRef.current = false;
            try { recognition.stop(); } catch {}
          };
        }, [speechSupported, apiUrl, ttsApiUrl, ttsModel, model, webSearch]);

        async function askAssistant(userText) {
          const userMessage = { role: "user", content: userText };
          const currentConversation = [...conversationRef.current, userMessage];
          conversationRef.current = currentConversation;

          setMessages((prev) => [...prev, userMessage, { role: "assistant", content: "Thinking..." }]);
          setStatus("thinking");

          const controller = new AbortController();
          streamAbortRef.current = controller;

          let assistantText = "";
          try {
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ messages: currentConversation, model, webSearch }),
              signal: controller.signal,
            });

            if (!response.ok || !response.body) {
              const details = await response.text().catch(() => "");
              throw new Error(details || `Streaming failed (${response.status})`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const parts = buffer.split("\n\n");
              buffer = parts.pop() || "";

              for (const part of parts) {
                const line = part.split("\n").find((l) => l.startsWith("data:"));
                if (!line) continue;

                const payload = line.replace("data:", "").trim();
                if (!payload) continue;

                let parsed;
                try { parsed = JSON.parse(payload); } catch { continue; }
                const chunk = parsed?.message?.content || "";

                if (chunk) {
                  assistantText += chunk;
                  setMessages((prev) => {
                    const next = [...prev];
                    next[next.length - 1] = { role: "assistant", content: assistantText };
                    return next;
                  });
                }
              }
            }

            conversationRef.current = [...conversationRef.current, { role: "assistant", content: assistantText }];
            streamAbortRef.current = null;

            if (voiceEnabledRef.current && assistantText) {
              await speakAssistantText(assistantText);
            } else {
              setStatus(voiceEnabledRef.current ? "listening" : "idle");
            }
          } catch (error) {
            if (error.name !== "AbortError") {
              setMessages((prev) => {
                const next = [...prev];
                next[next.length - 1] = { role: "assistant", content: `Error: ${error.message}` };
                return next;
              });
              setStatus("error");
            }
          } finally {
            streamAbortRef.current = null;
          }
        }

        function toggleVoice() {
          if (!speechSupported) return;

          if (!voiceEnabled) {
            setVoiceEnabled(true);
            voiceEnabledRef.current = true;
            startListening();
            return;
          }

          setVoiceEnabled(false);
          voiceEnabledRef.current = false;
          stopListening();
          setLiveTranscript("");

          if (streamAbortRef.current) streamAbortRef.current.abort();
          window.speechSynthesis.cancel();
          speakingRef.current = false;
          setStatus("idle");
        }

        return (
          <div className="container">
            <div className="panel">
              <div className="top">
                <div>
                  <h1>Local Voice Assistant</h1>
                  <div className="subtitle">Qwen3-TTS speak-back + mic gating to prevent assistant audio from being re-captured.</div>
                </div>
                <button className={`btn ${voiceEnabled ? "stop" : ""}`} onClick={toggleVoice} disabled={!speechSupported}>
                  {voiceEnabled ? "Stop Voice" : "Start Voice"}
                </button>
              </div>

              <div className="meta-row">
                <input type="text" value={apiUrl} onChange={(e) => setApiUrl(e.target.value)} title="Chat stream API URL" />
                <input type="text" value={model} onChange={(e) => setModel(e.target.value)} title="LLM model" />
                <input type="text" value={ttsModel} onChange={(e) => setTtsModel(e.target.value)} title="TTS model" />
                <label className="checkbox">
                  <input type="checkbox" checked={webSearch} onChange={(e) => setWebSearch(e.target.checked)} />
                  Web Search
                </label>
              </div>

              <div className="status-card">
                <div className="status-line">Status: {status}</div>
                <div className="status-line">TTS API: {ttsApiUrl}</div>
                <div className="live-line">Listening transcript: {liveTranscript || "(waiting for speech)"}</div>
              </div>

              <div className="chat" ref={chatRef}>
                {messages.map((m, idx) => (
                  <div key={idx} className={`msg ${m.role === "user" ? "user" : "assistant"}`}>
                    <div className="small">{m.role === "user" ? "You" : "Assistant"}</div>
                    {m.content}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
